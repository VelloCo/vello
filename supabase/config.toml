
[functions.create-invite]
enabled = true
verify_jwt = true
import_map = "./functions/create-invite/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/create-invite/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create-invite/*.html" ]

[functions.accept-invite]
enabled = true
verify_jwt = false
import_map = "./functions/accept-invite/deno.json"
entrypoint = "./functions/accept-invite/index.ts"
